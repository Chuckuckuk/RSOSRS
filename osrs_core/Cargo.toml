[package]
name = "osrs_core"
version = "0.1.0"
edition = "2021"
default-run = "osrs_core"

[dependencies]
bevy = "0.20.0"
osrs_cache = { path = "../osrs_cache" }
osrs_render = { path = "../osrs_render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3